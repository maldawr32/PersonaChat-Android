name: Wire DeepSeek settings

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/wire-deepseek.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add DeepSeek entry to Tools
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/maldawr/chatsimulator/MainActivity.java')
          s = p.read_text()
          old = 'private void settingsPage(){section("Appearance & icons");'
          new = 'private void settingsPage(){section("AI");setting("DeepSeek AI","API key • deepseek-v4-pro",v->startActivity(new Intent(this,DeepSeekSettingsActivity.class)));section("Appearance & icons");'
          if new in s:
              print('Already wired')
          elif old in s:
              p.write_text(s.replace(old, new, 1))
          else:
              raise SystemExit('settingsPage anchor not found')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/maldawr/chatsimulator/MainActivity.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Expose DeepSeek settings in Tools'
          git push origin main
