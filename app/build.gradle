plugins { id 'com.android.application' }
android { namespace 'com.maldawr.chatsimulator'; compileSdk 36
    defaultConfig { applicationId 'com.maldawr.personachat'; minSdk 29; targetSdk 36; versionCode 7; versionName '0.4.1-v7.1' }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { def room_version='2.8.4'; def work_version='2.11.2'; implementation "androidx.room:room-runtime:$room_version"; annotationProcessor "androidx.room:room-compiler:$room_version"; implementation "androidx.work:work-runtime:$work_version" }
